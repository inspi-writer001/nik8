[package]
name = "nik8_sender"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
opus-rs = { version = "0.1.37", features = ["libm"], default-features = false }
solana-address = { version = "2.7.0", features = ["curve25519", "decode"] }
solana-hash = { version = "4.3.0", features = ["std", "decode"] }
solana-keypair = "3.1.2"
solana-rpc-client = "4.3.0"
solana-signer = "3.0.1"
solana-system-interface = "3.3.0"
solana-tpu-client-next = { version = "4.3.0", features = [
    "websocket-node-address-service",
    "agave-unstable-api",
    "dev-context-only-utils",
] }
solana-transaction = { version = "4.3.0", features = ["serde", "verify"] }
bincode = "1.3.3"


tokio = { version = "1.53.3", features = ["full"] }
serde = "1.0.229"
thiserror = "2.0.21"
solana-epoch-info = { version = "3.1.0", features = ["serde"] }
solana-rpc-client-types = { version = "4.3.2", features = [
    "agave-unstable-api",
] }
async-trait = "0.1.92"
solana-pubsub-client = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-rpc-client-api = { version = "4.3.2", features = ["agave-unstable-api"] }
futures-util = "0.3.34"
wtransport = "0.7.2"
dotenvy = "0.15.7"

[dev-dependencies]
solana-instruction = "3.5.0"
