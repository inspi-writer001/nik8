[package]
name = "nik8_program"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pack1 = { version = "1.1.0", features = ["bytemuck"] }
pinocchio = "0.11.2"
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
nik8_shared = { path = "../shared" }
shank = "0.4.9"


[dev-dependencies]
dotenvy = "0.15.7"
litesvm = "0.18.1"
solana-address = "2.7.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-pubkey = "4.3.0"
solana-rpc-client = "4.3.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
